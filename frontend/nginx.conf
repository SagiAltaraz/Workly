server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    # Keep the progress stream (SSE) unbuffered.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
